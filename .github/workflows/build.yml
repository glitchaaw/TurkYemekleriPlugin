name: Build Turkish Food Plugin

'on':
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Build Plugin
        run: gradle build
        working-directory: REDZ_Turk_Yemekleri_Kaynak_Projesi-4/TurkYemekleriPlugin/plugin

      - name: Upload Plugin
        uses: actions/upload-artifact@v4
        with:
          name: TurkYemekleriPlugin
          path: REDZ_Turk_Yemekleri_Kaynak_Projesi-4/TurkYemekleriPlugin/plugin/build/libs/*.jar
